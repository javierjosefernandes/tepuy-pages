<!DOCTYPE html>
<!-- The link preview image for the studio's pages. Open in a browser at
     1200 x 630 and save a screenshot to assets/og/hatilu.png. See the README. -->
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../../assets/site.css">
<style>
  :root { color-scheme: light; --bg: #fafaf8; --fg: #101311; --body: #3b403c; --muted: #6c726d; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body { position: relative; background: var(--bg); }
  h1 { position: absolute; left: 80px; top: 150px; font-size: 150px; font-weight: 800; letter-spacing: -0.055em; line-height: 0.95; }
  p { position: absolute; left: 86px; top: 340px; width: 820px; font-size: 40px; line-height: 1.3; letter-spacing: -0.015em; color: var(--body); }
  small { position: absolute; left: 86px; bottom: 64px; font-size: 26px; color: var(--muted); }
</style>
</head>
<body>
  <h1>Hatilú Studio</h1>
  <p>Independent apps for iPhone, iPad and Apple Watch. No ads, no clutter, no account to create.</p>
  <small>hatilu.com</small>
</body>
</html>
