<!DOCTYPE html>
<!-- The link preview image for Tepuy's pages. Open in a browser at 1200 x 630
     and save a screenshot to assets/og/tepuy.png. See the README. -->
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../../assets/site.css">
<link rel="stylesheet" href="../../tepuy/theme.css">
<style>
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body { position: relative; background: var(--band-bg); color: var(--band-body); }
  .copy { position: absolute; left: 80px; top: 76px; width: 640px; }
  .name { display: flex; align-items: center; gap: 18px; font-size: 34px; font-weight: 700; letter-spacing: -0.02em; color: var(--band-fg); }
  .name img { width: 68px; height: 68px; border-radius: 22.5%; box-shadow: 0 0 0 1.5px #24402f; }
  h1 { margin-top: 62px; font-size: 76px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.04; color: var(--band-fg); text-wrap: initial; }
  h1 em { font-style: normal; color: var(--band-highlight); }
  .where { position: absolute; left: 80px; bottom: 64px; font-size: 26px; color: var(--band-body); }
  .device { --device-width: 330px; position: absolute; right: 96px; top: 70px; }
  svg { position: absolute; left: 0; bottom: 0; width: 100%; fill: var(--band-shape); }
</style>
</head>
<body>
  <svg viewBox="0 0 1200 260" aria-hidden="true"><path d="M0 260v-22c230-4 470-14 650-40l26-136c2-9 8-14 17-14l420-8c10 0 16 5 18 14l22 128c16 4 32 7 47 9v69z"/></svg>
  <div class="copy">
    <div class="name"><img src="../../tepuy/img/icon-512.png" alt="">Tepuy</div>
    <h1><em>Free. No ads.</em><br>No subscription to log your workouts.</h1>
  </div>
  <p class="where">A workout tracker for iPhone, iPad and Apple Watch</p>
  <div class="device"><img src="../../tepuy/img/dashboard.webp" alt=""></div>
</body>
</html>
